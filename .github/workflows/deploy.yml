# Docs for the Azure Functions deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy to Azure Function App - dddmelb-2024-api

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dddmelb-2024-api
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_NAME: 'dddmelb-2024-api'
  PUBLISH_PATH: './publish'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet build DDD.sln --configuration Release

      - run: dotnet test DDD.Sessionize.Tests --configuration Release --no-build

      - run: dotnet publish DDD.Functions/DDD.Functions.csproj --configuration Release --no-build --output ${{ env.PUBLISH_PATH }}

      # The federated credential trusts only refs/heads/master, so login fails on any other ref.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PUBLISH_PATH }}
