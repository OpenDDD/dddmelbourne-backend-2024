# Docs for the Azure Functions deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - dddmelb-2024

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dddmelb-2024
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_NAME: 'dddmelb-2024'
  PUBLISH_PATH: './publish'
  DOTNET_VERSION: '6.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet build DDD.sln --configuration Release

      - run: dotnet test DDD.Sessionize.Tests --configuration Release --no-build

      - run: dotnet publish DDD.Functions/DDD.Functions.csproj --configuration Release --no-build --output ${{ env.PUBLISH_PATH }}

      # The federated credential trusts only refs/heads/master, so login fails on any other ref.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PUBLISH_PATH }}
