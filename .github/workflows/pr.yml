name: PR build and test

on:
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet build DDD.sln --configuration Release

      - run: dotnet test --project DDD.Sessionize.Tests --configuration Release --no-build
